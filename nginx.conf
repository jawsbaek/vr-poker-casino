server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Enable WebXR spatial tracking and immersive-vr for Apple Vision Pro & Android XR
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript model/gltf-binary;

    location ~* \.usdz$ {
        default_type model/vnd.usdz+zip;
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}
